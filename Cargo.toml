[package]
name = "bassembler"
version = "0.1.0"
edition = "2024"
description = "Assemble a Git branch from the commits of chosen issues across several repositories"
license = "MIT"
readme = "README.md"
repository = "https://github.com/crimaniak/bassembler"
keywords = ["git", "cherry-pick", "release", "cli"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"
exclude = [".github/", "docs/"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3", features = ["formatting", "macros"] }
